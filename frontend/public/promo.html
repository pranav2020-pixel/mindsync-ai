<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MindSync AI</title>
  <script>
    // Complete audio killswitch
    try {
      if (window.AudioContext) window.AudioContext = class { close() {} resume() {} suspend() {} };
      if (window.webkitAudioContext) window.webkitAudioContext = class { close() {} resume() {} };
      if (window.Audio) window.Audio = class { play() {} pause() {} };
    } catch(e) {}
  </script>
</head>
<body style="background:#050811; color:#ffffff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <div style="text-align:center; padding:20px;">
    <h2 style="color:#38bdf8; margin-bottom:8px;">MindSync AI</h2>
    <p style="color:#94a3b8; font-size:14px; margin:0;">Audio is permanently disabled.</p>
  </div>
</body>
</html>
