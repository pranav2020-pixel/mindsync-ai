services:
  - type: web
    name: mindsync-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mindsync-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: FRONTEND_URL
        value: https://mindsync-ai-six.vercel.app
      - key: GOOGLE_CLIENT_ID
        value: 663226411128-bts6nkunj6fl5nogo87i06j8eic6o956.apps.googleusercontent.com
      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: pranavmsc2020@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: '"MindSync AI" <pranavmsc2020@gmail.com>'

databases:
  - name: mindsync-postgres
    plan: free
    databaseName: mindsync
    user: mindsync_user
